[package]
name = "avis-imgv"
description = "GPU accelerated image viewer. Decodes a whole folder into RAM and keeps a configurable window of images resident on the GPU for instant navigation."
license = "GPL-3.0"
homepage = "https://github.com/hats-np/avis-imgv"
repository = "https://github.com/hats-np/avis-imgv"
version = "0.4.0"
edition = "2021"
readme = "README.md"
keywords = ["image_viewer", "image"]

[dependencies]
eframe = { version = "0.33.0", features = ["wgpu"] }
epaint = { version = "0.33.0" }
image = { version = "0.25.6", default-features = true }
serde = { version = "1.0.219" }
serde_json = { version = "1.0.140" }
directories = { version = "6.0.0" }
lcms2 = { version = "6.1.0" }
regex = { version = "1.11.1" }
rfd = { version = "0.15.3" }
fast_image_resize = { version = "5.1.4" }
notify = "8.0.0"
tracing-subscriber = { version = "0.3", default-features = true }
tracing = "0.1.41"
itertools = "0.14.0"
rayon = "1.11.0"
flate2 = "1.1.2"
quick-xml = "0.42.0"
jpegxl-rs = { version = "0.11.2", features = ["vendored"], optional = true }

[build-dependencies]
pkg-config = { version = "0.3", optional = true }
vcpkg = { version = "0.2", optional = true }

# Decoding, resampling and colour conversion all happen in dependencies, and
# an unoptimised build of them makes a debug build of the viewer unusable.
[profile.dev.package."*"]
opt-level = 3

# Generic code from those dependencies is instantiated here, so the viewer's
# own crate needs some optimisation too; level 1 keeps debugging workable while
# decoding a 24 megapixel photograph stays roughly twice as fast.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[features]
default = ["custom_font"]
custom_font = []
# JPEG XL support. Requires cmake and a C++ toolchain to build libjxl from source.
jxl = ["dep:jpegxl-rs"]
# Developing raw files rather than showing their embedded preview. Links
# against a system LibRaw; see build.rs for how it is found.
libraw = ["dep:pkg-config", "dep:vcpkg"]
