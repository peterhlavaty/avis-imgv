name: Rust

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The main check, on every platform the viewer runs on. A viewer is not much
  # use if it only builds where it was written, and the two things that break
  # across platforms — path handling and the bin — are exactly what the file
  # operations here are made of.
  build:
    strategy:
      # One platform failing should not hide what the others would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Formatting
      run: cargo fmt --check

  # `--no-default-features` now means two things, so it is run twice.
  #
  # With `gui`, it is the check this job has always been: the bundled font is a
  # default feature and somebody building without it gets a different code path
  # through the theme. Without `gui`, it is the layering — the crate compiles
  # with `view`, `ui` and `app` taken out of it, so any reference to them from
  # the half that decides is an unresolved import rather than a note in a test.
  #
  # Checked with clippy rather than only built, because a warning there is as
  # much a failure as anywhere else.
  no-default-features:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
    - name: Clippy without the default features
      run: cargo clippy --all-targets --no-default-features --features gui -- -D warnings
    - name: Run tests without the default features
      run: cargo test --no-default-features --features gui --verbose
    - name: The layering, checked by the compiler
      run: cargo clippy --no-default-features -- -D warnings

  # Developing raw files links against LibRaw, so the FFI needs a job of its
  # own to stay compiled and its tests to keep running against a real library.
  libraw:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libraw-dev
    - name: Clippy with LibRaw
      run: cargo clippy --all-targets --features libraw -- -D warnings
    - name: Run tests with LibRaw
      run: cargo test --features libraw --verbose

  # JPEG XL is optional because it builds libjxl from source, so it needs a
  # job of its own to stay compiled.
  jpeg-xl:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev cmake
    - name: Build with JPEG XL
      run: cargo build --features jxl --verbose
