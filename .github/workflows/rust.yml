name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install system dependencies
      run: sudo apt-get install libgtk-3-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Formatting
      run: cargo fmt --check

  # Developing raw files links against LibRaw, so the FFI needs a job of its
  # own to stay compiled and its tests to keep running against a real library.
  libraw:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install system dependencies
      run: sudo apt-get install libgtk-3-dev libraw-dev
    - name: Build with LibRaw
      run: cargo build --features libraw --verbose
    - name: Run tests
      run: cargo test --features libraw --verbose

  # JPEG XL is optional because it builds libjxl from source, so it needs a
  # job of its own to stay compiled.
  jpeg-xl:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install system dependencies
      run: sudo apt-get install libgtk-3-dev cmake
    - name: Build with JPEG XL
      run: cargo build --features jxl --verbose
